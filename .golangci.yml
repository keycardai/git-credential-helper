version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - whitespace

  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests run git and the fake keycard on purpose.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/keycardai/git-credential-helper
